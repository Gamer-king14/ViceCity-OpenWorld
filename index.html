<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Vice City Open World</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#101b27;color:white;font-family:Arial}canvas{display:block}
#intro{position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,#081325bb,transparent 40%,#081325bb);transition:opacity .8s}#intro.hidden{opacity:0;visibility:hidden}
#brand{position:absolute;top:5vh;left:5vw;font-weight:900;font-size:clamp(28px,6vw,64px);letter-spacing:.12em;color:#ff8a67;text-shadow:0 0 20px #ff4d9a}

</style></head><body>
<div id="intro"><div id="brand">VICE CITY<small id="sub">OPEN WORLD • CITY EDITION</small></div></div>
<div id="loading">VICE CITY wird geladen…</div><div id="tip">Joystick: links/rechts drehen · hoch/runter fahren<br>E · Auto ein/aus · rechts ziehen: Kamera</div>

<div id="stickBase"><div id="stickKnob"></div></div><div id="touch"><button class="touchbtn" id="jump">↑</button><button class="touchbtn" id="interact">E</button></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js"}}</script>
<script type="module">
const loader=document.getElementById('loading');
import('three').then(THREE=>{
const scene=new THREE.Scene();scene.background=new THREE.Color(0x87bde1);scene.fog=new THREE.Fog(0x87bde1,110,380);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,600);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.4));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe5f5ff,0x43522a,2));const sun=new THREE.DirectionalLight(0xfff1d5,2);sun.position.set(-45,80,30);sun.castShadow=true;scene.add(sun);

for(let z=-160;z<=160;z+=80){box(400,.12,18,asphalt,0,.02,z);for(let x=-190;x<190;x+=28)box(9,.025,.22,line,x,.1,z)}
for(let x=-160;x<=160;x+=80)box(18,.12,400,asphalt,x,.02,0);
for(let x=-140;x<=140;x+=40)for(let z=-140;z<=140;z+=40){if(Math.random()<.14)continue;let w=18+Math.random()*10,d=18+Math.random()*10,h=8+Math.random()*46,c=[0xd6c4a5,0xc4d1d9,0xf0d4be,0x9db5c6,0xe5bca0][Math.floor(Math.random()*5)];box(w,h,d,mat(c),x,h/2,z);if(h>12){for(let y=4;y<h-2;y+=4){for(let wx=-w*.34;wx<=w*.34;wx+=w*.34)box(w*.22,1.1,.12,glass,x+wx,y,z+d/2+.07);for(let wx=-w*.34;wx<=w*.34;wx+=w*.34)box(.12,1.1,d*.65,glass,x+w/2+.07,y,z+wx)}}box(w+2,.25,d+2,sidewalk,x,.2,z)}
box(36,.3,36,mat(0xb2a58a),0,.05,0);
for(let i=0;i<18;i++){let x=-110+Math.random()*220,z=-110+Math.random()*220;if(Math.abs(x%80)>26&&Math.abs(z%80)>26)continue;box(.35,6,.35,mat(0x8a5931),x,3,z);let crown=new THREE.Mesh(new THREE.SphereGeometry(2.2,10,8),mat(0x27864f));crown.position.set(x,7,z);scene.add(crown);for(let a=0;a<5;a++){let fr=new THREE.Mesh(new THREE.ConeGeometry(1.1,5,8),mat(0x338f58));fr.position.set(x+Math.cos(a*1.25)*1.4,7.2,z+Math.sin(a*1.25)*1.4);fr.rotation.z=Math.cos(a*1.25)*.25;scene.add(fr)}}
// simple enterable shop
const doorPos=new THREE.Vector3(18,0,28);box(10,7,10,mat(0xb6b4ae),18,3.5,28);box(4,3.4,.25,glass,18,2.2,22.85);box(1.5,3.4,.3,mat(0x9a6540),15.4,2.2,22.85);box(1.5,3.4,.3,mat(0x9a6540),20.6,2.2,22.85);
const interior=new THREE.Group();scene.add(interior);interior.visible=false;function room(w,h,d,m,x,y,z){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);interior.add(o)}
room(18,.3,18,mat(0x80796c),1000,.1,1000);room(18,7,.3,mat(0xd7d2c5),1000,3.5,991);room(.3,7,18,mat(0xd7d2c5),991,3.5,1000);room(.3,7,18,mat(0xd7d2c5),1009,3.5,1000);room(18,7,.3,mat(0xd7d2c5),1000,3.5,1009);room(18,.3,18,mat(0x5c5043),1000,7,1000);room(4,1,2,mat(0x6b4028),1003,1,1002);
let inside=false;
const player=new THREE.Group();scene.add(player);
const skin=mat(0xc58d68,.78),shirt=mat(0x285b88,.86),pants=mat(0x263545,.9),shoes=mat(0x171d25,.75),hair=mat(0x30241d,.95),eye=mat(0x211a16,.5);
function part(geo,m,x,y,z,parent=player){let mesh=new THREE.Mesh(geo,m);mesh.position.set(x,y,z);mesh.castShadow=true;mesh.receiveShadow=true;parent.add(mesh);return mesh}
function capsule(parent,r,len,m,x,y,z){return part(new THREE.CapsuleGeometry(r,len,5,10),m,x,y,z,parent)}
// Anatomical silhouette: rounded torso, neck, head, layered arms and legs.
capsule(player,.34,.55,shirt,0,1.48,0);
part(new THREE.SphereGeometry(.34,16,12),shirt,0,1.22,0);
capsule(player,.105,.18,skin,0,1.91,0);
part(new THREE.SphereGeometry(.255,20,16),skin,0,2.18,0);
part(new THREE.SphereGeometry(.26,16,12,0,Math.PI*2,0,Math.PI*.56),hair,0,2.27,.015);
part(new THREE.SphereGeometry(.065,12,8),skin,-.26,2.17,0);part(new THREE.SphereGeometry(.065,12,8),skin,.26,2.17,0);
for(let x of [-.085,.085])part(new THREE.SphereGeometry(.025,8,8),eye,x,2.19,-.238);
part(new THREE.SphereGeometry(.035,8,8),skin,0,2.12,-.26);
const armL=new THREE.Group(),armR=new THREE.Group();armL.position.set(-.39,1.73,0);armR.position.set(.39,1.73,0);player.add(armL,armR);
for(let [g,s] of [[armL,-1],[armR,1]]){capsule(g,.115,.32,shirt,0,-.22,0);capsule(g,.09,.31,skin,0,-.59,-.005);part(new THREE.SphereGeometry(.095,10,8),skin,0,-.79,-.005,g);g.rotation.z=s*.08}
const legL=new THREE.Group(),legR=new THREE.Group();legL.position.set(-.17,1.02,0);legR.position.set(.17,1.02,0);player.add(legL,legR);
for(let g of [legL,legR]){capsule(g,.135,.38,pants,0,-.25,0);capsule(g,.105,.34,pants,0,-.65,-.015);part(new THREE.SphereGeometry(.12,12,8),shoes,0,-.91,-.075,g);part(new THREE.BoxGeometry(.22,.12,.34),shoes,0,-.93,-.13,g)}
player.position.set(0,0,12);
let camYaw=0,camPitch=.24,carMode=false,velocity=0,jumpVelocity=0,onGround=true;const keys={};let cars=[];
function makeCar(x,z,color){let g=new THREE.Group(),paint=mat(color,.42),chrome=mat(0xb8c4ca,.3),dark=mat(0x18232c,.5),lamp=mat(0xfff1c4,.3),tail=mat(0xff3344,.35);function add(geo,m,pos){let o=new THREE.Mesh(geo,m);o.position.set(...pos);o.castShadow=true;g.add(o);return o}
add(new THREE.BoxGeometry(2.05,1.05,4.15),paint,[0,.78,0]);add(new THREE.BoxGeometry(1.62,.9,2.12),glass,[0,1.48,-.15]);add(new THREE.BoxGeometry(1.82,.22,1.02),paint,[0,1.23,-1.48]);add(new THREE.BoxGeometry(2.12,.22,.22),chrome,[0,.38,-2.08]);add(new THREE.BoxGeometry(2.12,.22,.22),chrome,[0,.38,2.08]);for(let x of [-.68,.68]){add(new THREE.BoxGeometry(.38,.22,.1),lamp,[x,.95,-2.08]);add(new THREE.BoxGeometry(.36,.22,.1),tail,[x,.95,2.08])}let wheels=[];for(let x of [-1,1])for(let z of [-1.32,1.32]){let w=add(new THREE.CylinderGeometry(.43,.43,.28,18),dark,[x,.43,z]);w.rotation.z=Math.PI/2;let r=add(new THREE.CylinderGeometry(.22,.22,.3,12),chrome,[x,.43,z]);r.rotation.z=Math.PI/2;wheels.push(w)}g.position.set(x,0,z);g.userData.wheels=wheels;scene.add(g);return g}
cars.push(makeCar(8,12,0xe54e63),makeCar(-25,-10,0x26a5c2),makeCar(60,55,0xf1c64b));let activeCar=cars[0];
function message(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}
function enter(){inside=true;interior.visible=true;player.position.set(1000,0,1000);activeCar.visible=false;document.getElementById('mode').textContent='im Gebäude';document.getElementById('hint').textContent='E zum Ausgang';message('Im Gebäude')}
function exit(){inside=false;interior.visible=false;player.position.set(18,0,20);activeCar.visible=true;document.getElementById('mode').textContent='zu Fuß';message('Draußen')}
function interact(){if(inside){exit();return}if(!carMode&&player.position.distanceTo(doorPos)<8){enter();return}if(!carMode){let nearest=null,d=99;for(let c of cars){let dist=player.position.distanceTo(c.position);if(dist<d){d=dist;nearest=c}}if(d<7){activeCar=nearest;carMode=true;player.visible=false;document.getElementById('mode').textContent='im Auto';message('Eingestiegen')}else message('Kein Auto in der Nähe')}else{carMode=false;player.visible=true;player.position.copy(activeCar.position);player.position.x+=3;document.getElementById('mode').textContent='zu Fuß';message('Ausgestiegen')}}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='e')interact()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const base=document.getElementById('stickBase'),knob=document.getElementById('stickKnob');let pointer=null,joyX=0,joyY=0;
function reset(){pointer=null;joyX=joyY=0;knob.style.transform='translate(0,0)'}
function moveJoy(e){let r=base.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,max=Math.min(r.width,r.height)*.34,l=Math.hypot(dx,dy);if(l>max){dx=dx/l*max;dy=dy/l*max}knob.style.transform='translate('+dx+'px,'+dy+'px)';joyX=dx/max;joyY=dy/max}
base.addEventListener('pointerdown',e=>{e.preventDefault();pointer=e.pointerId;base.setPointerCapture(e.pointerId);moveJoy(e)});base.addEventListener('pointermove',e=>{if(pointer===e.pointerId)moveJoy(e)});base.addEventListener('pointerup',e=>{if(pointer===e.pointerId)reset()});base.addEventListener('pointercancel',reset);
let dragging=false,lx=0,ly=0;renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;lx=e.clientX;ly=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointerup',()=>dragging=false);renderer.domElement.addEventListener('pointercancel',()=>dragging=false);renderer.domElement.addEventListener('pointermove',e=>{if(dragging){camYaw-=(e.clientX-lx)*.005;camPitch=Math.max(-.2,Math.min(1.05,camPitch+(e.clientY-ly)*.003));lx=e.clientX;ly=e.clientY}});
document.getElementById('interact').onclick=interact;document.getElementById('jump').onclick=()=>{if(!carMode&&!inside&&onGround){jumpVelocity=7.2;onGround=false}};
let last=performance.now();function animate(now){requestAnimationFrame(animate);let dt=Math.min((now-last)/1000,.05);last=now;let f=keys.w||keys.arrowup?1:keys.s||keys.arrowdown?-1:-joyY,turn=keys.a||keys.arrowleft?-1:keys.d||keys.arrowright?1:joyX;if(inside){camera.position.set(player.position.x+7,5,player.position.z+8);camera.lookAt(player.position.x,1,player.position.z)}else if(carMode){velocity+=(f*22-velocity*2.3)*dt;activeCar.rotation.y+=turn*dt*Math.min(2.4,Math.abs(velocity)*.08)*(velocity>=0?1:-1);activeCar.position.x+=Math.sin(activeCar.rotation.y)*velocity*dt;activeCar.position.z-=Math.cos(activeCar.rotation.y)*velocity*dt;camera.position.set(activeCar.position.x-Math.sin(activeCar.rotation.y+camYaw)*10,activeCar.position.y+5+camPitch*4,activeCar.position.z-Math.cos(activeCar.rotation.y+camYaw)*10);camera.lookAt(activeCar.position.x,activeCar.position.y+1,activeCar.position.z)}else{player.rotation.y-=turn*dt*2.5;let dir=new THREE.Vector3(Math.sin(player.rotation.y),0,-Math.cos(player.rotation.y));player.position.addScaledVector(dir,f*dt*(keys.shift?10:5));camera.position.set(player.position.x+Math.sin(player.rotation.y+camYaw+Math.PI)*8,player.position.y+4+camPitch*5,player.position.z+Math.cos(player.rotation.y+camYaw+Math.PI)*8);camera.lookAt(player.position.x,player.position.y+1,player.position.z);let swing=(Math.abs(f)+Math.abs(turn)>0)?Math.sin(now*.012)*.45:0;legL.rotation.x=swing;legR.rotation.x=-swing;armL.rotation.x=-swing*.7;armR.rotation.x=swing*.7}if(carMode&&activeCar.userData.wheels)for(let w of activeCar.userData.wheels)w.rotation.x+=velocity*dt*2.2;renderer.render(scene,camera);loader.style.display='none';document.getElementById('intro').classList.add('hidden')}
requestAnimationFrame(animate);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})
}).catch(err=>{loader.innerHTML='3D konnte nicht geladen werden.<br><small>Internetverbindung prüfen und neu laden.</small>';console.error(err)});
</script></body></html>
